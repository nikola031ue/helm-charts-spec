# Default values for shophub (spec 004, contracts/delivery.md).
# Never put secrets here: the database URL comes from the CNPG Secret <fullname>-db-app.

replicaCount: 2

image:
  repository: ghcr.io/nikola031ue/shophub
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Panel address (Ingress host). The Traefik default certificate covers it (kube-state README).
host: shophub.localhost
# The only namespace ShopHub writes Shops, Wallets and DiscordChannels to; the Role lives there.
shopsNamespace: shops
# Shop host suffix, for display only (shop URLs come from the Shop status).
shopDomain: shops.localhost
# DNS name of the Traefik pods: the only trusted proxies for X-Forwarded-For (research R7).
trustedProxyHost: traefik-proxies.traefik.svc.cluster.local
# FR-011.
maxShopsPerOwner: 5

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Role + RoleBinding in shopsNamespace only (rendered from serviceaccount.yaml). Must match the
# manifest the shophub k3s tests assert; CI fails on any difference.
rbac:
  create: true

# CloudNativePG Cluster <fullname>-db (rendered from deployment.yaml). Needs the CNPG operator.
database:
  create: true
  instances: 1
  size: 1Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}

# The app pods accept TCP 8080 only from the Traefik pods (rendered from ingress.yaml).
networkPolicy:
  enabled: true
  traefikNamespace: traefik
  traefikPodLabels:
    app.kubernetes.io/name: traefik

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
