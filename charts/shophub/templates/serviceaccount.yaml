{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shophub.serviceAccountName" . }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.rbac.create }}
---
# ShopHub's permissions (spec 004 contracts/delivery.md): in the shops namespace only, no
# ClusterRole. Shops, Wallets, DiscordChannels: what server-side apply, status reads and by-name
# deletes need. Secrets: get only. RBAC can't narrow get to <id>-admin (resourceNames needs fixed
# names), so the app reads nothing else (accepted by the maintainer, 2026-11-25).
# Rendered here, not in rbac.yaml, because Requirement 5.3 fixes the template files.
# CI compares these rules with the manifest the shophub k3s tests assert.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shophub.fullname" . }}
  namespace: {{ .Values.shopsNamespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
rules:
  - apiGroups: ["shophub.io"]
    resources: ["shops", "wallets", "discordchannels"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shophub.fullname" . }}
  namespace: {{ .Values.shopsNamespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shophub.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shophub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
