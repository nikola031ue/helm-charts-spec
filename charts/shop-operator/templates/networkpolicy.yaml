{{- if .Values.networkPolicy.enabled }}
# Spec 005 research R13: what the operator pod may reach, written down so a later default-deny
# can't silently stop payment detection: DNS; HTTPS anywhere (the chain provider, Discord) and
# the API server (443 and 6443); a shop's internal API (8081) in the shops namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shop-operator.fullname" . }}-egress
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shop-operator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.shopsNamespace }}
      ports:
        - { protocol: TCP, port: 8081 }
{{- end }}
