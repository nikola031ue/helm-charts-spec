apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shop-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shop-operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --shop-image={{ .Values.shopImage.repository }}
            - --shop-image-tag={{ .Values.shopImage.tag }}
            - --discord-guild-id={{ .Values.discord.guildID }}
            - --discord-token-secret={{ .Values.discord.tokenSecretName }}
            - --watch-namespace={{ .Values.shopsNamespace }}
            - --shop-domain={{ .Values.shopDomain }}
            - --ingress-class={{ .Values.ingressClassName }}
            - --ingress-namespace={{ .Values.ingressNamespace }}
            - --shophub-namespace={{ .Values.shophubNamespace }}
            - --trusted-proxy-host={{ .Values.trustedProxyHost }}
          env:
            # The operator reads the Discord token Secret from its own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
