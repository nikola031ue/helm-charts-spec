apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shop-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shop-operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --shop-image={{ .Values.shopImage.repository }}
            - --shop-image-tag={{ .Values.shopImage.tag }}
            - --discord-guild-id={{ .Values.discord.guildID }}
            - --discord-token-secret={{ .Values.discord.tokenSecretName }}
            - --watch-namespace={{ .Values.shopsNamespace }}
            - --shop-domain={{ .Values.shopDomain }}
            - --ingress-class={{ .Values.ingressClassName }}
            - --ingress-namespace={{ .Values.ingressNamespace }}
            - --shophub-namespace={{ .Values.shophubNamespace }}
            - --shophub-pod-selector={{ $sel := list }}{{ range $k, $v := .Values.shophubPodLabels }}{{ $sel = append $sel (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $sel }}
            - --trusted-proxy-host={{ .Values.trustedProxyHost }}
            - --operator-pod-selector={{ $op := list }}{{ range $k, $v := (include "shop-operator.selectorLabels" . | fromYaml) }}{{ $op = append $op (printf "%s=%s" $k $v) }}{{ end }}{{ join "," (sortAlpha $op) }}
            - --payments-token-address={{ .Values.payments.tokenAddress }}
            - --payments-chain-id={{ .Values.payments.chainId | int64 }}
            - --payments-confirmations={{ .Values.payments.confirmations | int64 }}
            - --payments-poll-interval={{ .Values.payments.pollInterval }}
            - --payments-logs-block-range={{ .Values.payments.logsBlockRange | int64 }}
            - --payments-order-minutes={{ .Values.payments.orderPaymentMinutes | int64 }}
            - --payments-explorer-tx-url={{ .Values.payments.explorerTxUrl }}
            - --payments-rpc-secret={{ .Values.payments.rpcSecretName }}
            - --payments-stall-after={{ .Values.payments.stallAfter }}
          env:
            # The operator reads the Discord token Secret from its own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
