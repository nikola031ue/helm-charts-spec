# Default values for shop-operator (spec 002, contracts/charts-and-kube-state.md).
# Never put secrets here — reference Kubernetes Secrets by name (Constitution Principle VI).

image:
  repository: ghcr.io/nikola031ue/shop-operator
  # Empty means .Chart.AppVersion. Always a pinned SemVer, never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# The shop application run for every Shop (spec 003, 005). Pinned tag only.
shopImage:
  repository: ghcr.io/nikola031ue/shop
  tag: "0.3.0"

discord:
  # Discord server (guild) ID — not a secret. Empty: DiscordChannels report
  # DiscordCredentialsMissing.
  guildID: ""
  # Name of the Secret in the release namespace holding the bot token under key "token".
  # Created once by hand (see the shop-operator README); never committed.
  tokenSecretName: shop-operator-discord

# Namespace scoping and per-Shop routing (operator 0.3.0, spec 004 FR-021, FR-026).
# The only namespace whose Shops and Wallets are reconciled. The chart creates it (label
# shophub.io/shops: "true") and keeps it on uninstall, so removing the chart never deletes Shops.
# The operator gets a Role there and in its own namespace (platform alerts DiscordChannel);
# nothing cluster-wide.
shopsNamespace: shops
# A Shop is served at https://<shop>.<shopDomain>; the entry point's default certificate must
# cover *.<shopDomain>.
shopDomain: shops.localhost
# IngressClass of every Shop Ingress.
ingressClassName: traefik
# The Shop NetworkPolicy admits TCP 80 only from the entry point namespace and, in the ShopHub
# namespace, only from pods carrying all of shophubPodLabels (the shophub chart's app pods).
ingressNamespace: traefik
shophubNamespace: shophub
shophubPodLabels:
  app.kubernetes.io/name: shophub
  app.kubernetes.io/instance: shophub
# DNS name whose addresses are the only proxies the shop app trusts (TRUSTED_PROXY_HOST): the
# headless Service in front of the Traefik pods. Empty means the app trusts no proxy.
trustedProxyHost: traefik-proxies.traefik.svc.cluster.local

# Crypto payments (spec 005, operator 0.4.0). Public settings only: the provider endpoint URL
# carries an API key and lives in a Secret made by hand (rpcSecretName, key "url"), never here.
payments:
  # mUSDT token contract on the chain below. Empty turns payments and the chain watcher off
  # (Wallets report PaymentsWatching=False/TokenNotConfigured; shops refuse checkout).
  tokenAddress: ""
  chainId: 11155111
  # Blocks that must follow a transfer's block before it counts.
  confirmations: 6
  pollInterval: 12s
  # Most blocks one log query covers; free provider plans limit it.
  logsBlockRange: 10
  orderPaymentMinutes: 30
  explorerTxUrl: https://sepolia.etherscan.io/tx/
  # Secret in the release namespace whose key "url" is the provider endpoint. Created by hand.
  rpcSecretName: shop-operator-rpc
  # A Wallet whose chain reading is further behind than this reports PaymentsWatching=Stalled.
  stallAfter: 5m

# Spec 005 D-4: a ValidatingAdmissionPolicy that refuses deleting a Shop in shopsNamespace
# unless it carries ShopHub's shophub.io/delete-requested annotation. Kubernetes' namespace
# controller and garbage collector are exempt, so deleting the namespace never hangs. Needs
# Kubernetes 1.30+. Roll ShopHub 0.3.0 out first: older ShopHub deletes without the annotation.
shopDeleteGuard:
  enabled: true

# Spec 005 research R13: an explicit egress allowance for the operator pod (DNS, HTTPS/API
# server, the shops' internal port 8081), so a later default-deny can't stop payment detection.
networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nameOverride: ""
fullnameOverride: ""
