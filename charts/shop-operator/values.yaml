# Default values for shop-operator (spec 002, contracts/charts-and-kube-state.md).
# Never put secrets here — reference Kubernetes Secrets by name (Constitution Principle VI).

image:
  repository: ghcr.io/nikola031ue/shop-operator
  # Empty means .Chart.AppVersion. Always a pinned SemVer, never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# Placeholder Shop application run for every Shop until feature 3 (FR-007). Pinned tag only.
shopImage:
  repository: nginx
  tag: "1.27.3"

discord:
  # Discord server (guild) ID — not a secret. Empty: DiscordChannels report
  # DiscordCredentialsMissing.
  guildID: ""
  # Name of the Secret in the release namespace holding the bot token under key "token".
  # Created once by hand (see the shop-operator README); never committed.
  tokenSecretName: shop-operator-discord

# Namespace scoping and per-Shop routing (operator 0.3.0, spec 004 FR-021, FR-026).
# The only namespace whose Shops and Wallets are reconciled. The chart creates it (label
# shophub.io/shops: "true") and keeps it on uninstall, so removing the chart never deletes Shops.
# The operator gets a Role there and in its own namespace (platform alerts DiscordChannel);
# nothing cluster-wide.
shopsNamespace: shops
# A Shop is served at https://<shop>.<shopDomain>; the entry point's default certificate must
# cover *.<shopDomain>.
shopDomain: shops.localhost
# IngressClass of every Shop Ingress.
ingressClassName: traefik
# The Shop NetworkPolicy admits TCP 80 only from these two namespaces.
ingressNamespace: traefik
shophubNamespace: shophub
# DNS name whose addresses are the only proxies the shop app trusts (TRUSTED_PROXY_HOST): the
# headless Service in front of the Traefik pods. Empty means the app trusts no proxy.
trustedProxyHost: traefik-proxies.traefik.svc.cluster.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nameOverride: ""
fullnameOverride: ""
