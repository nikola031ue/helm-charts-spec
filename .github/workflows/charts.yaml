name: charts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    name: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Check Requirement 5.3 layout
        run: bash .github/scripts/check-layout.sh
      - name: Test layout checker
        run: bats .github/tests/check-layout.bats

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: helm lint --strict
        run: for c in charts/*/; do helm lint --strict "$c"; done
      - name: No secrets in chart defaults
        run: bash .github/scripts/scan-secrets.sh charts/*/values.yaml
      - name: Test secrets scanner
        run: bats .github/tests/scan-secrets.bats

  template:
    name: template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Render and validate manifests
        run: |
          set -euo pipefail
          for c in charts/*/; do
            echo "::group::$c"
            helm template ci "$c" | kubeconform -strict -ignore-missing-schemas -summary
            helm template ci "$c" | bash .github/scripts/check-images.sh
            echo "::endgroup::"
          done
      - name: No appVersion latest
        run: bash .github/scripts/check-images.sh --charts charts/*/
      - name: Test image checker
        run: bats .github/tests/check-images.bats

  rbac-drift:
    name: rbac-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      # The manifest the shophub k3s RBAC tests assert (spec 004 T014), from shophub's main.
      - uses: actions/checkout@v4
        with:
          repository: nikola031ue/shophub-spec
          ref: main
          path: shophub
          persist-credentials: false
          sparse-checkout: tests/ShopHub.Api.Tests/Integration/K3s/Manifests
      - name: Chart RBAC equals the tested manifest (spec 004 T023)
        run: |
          bash .github/scripts/check-shophub-rbac.sh charts/shophub \
            shophub/tests/ShopHub.Api.Tests/Integration/K3s/Manifests/shophub-rbac.yaml
      - name: Test drift checker
        run: bats .github/tests/check-shophub-rbac.bats

  version:
    name: version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Changed charts bump SemVer and are unpublished
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash .github/scripts/check-version.sh
      - name: Test version checker and publisher
        run: |
          chmod +x .github/tests/stubs/*
          bats .github/tests/check-version.bats .github/tests/publish.bats

  install:
    name: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.27.0
          # Pinned: the shop-operator chart's delete guard needs ValidatingAdmissionPolicy (1.30+).
          node_image: kindest/node:v1.32.2
          cluster_name: ci
      - name: CloudNativePG operator (the shophub chart's database; same version as kube-state)
        run: |
          set -euo pipefail
          helm install cnpg oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg --version 0.29.2 \
            -n cnpg-system --create-namespace --wait --timeout 5m
          kubectl wait --for=condition=Established --timeout=60s crd/clusters.postgresql.cnpg.io
      - name: Install every chart with default values (FR-005)
        run: |
          set -euo pipefail
          # shop-operator first: it installs the CRDs other charts use (spec 002 T021).
          order=(shop-operator)
          for d in charts/*/; do
            c="$(basename "$d")"
            [[ "$c" == shop-operator ]] || order+=("$c")
          done
          for c in "${order[@]}"; do
            ns="ci-$c"
            # The platform alerts channel lives in the operator's namespace: operator 0.3.0
            # reconciles DiscordChannels only there and in its shops namespace (spec 004 FR-026).
            [[ "$c" == shophub-discord ]] && ns=ci-shop-operator
            helm install "$c" "charts/$c" -n "$ns" --create-namespace --wait --timeout 5m
            if [[ "$c" == shop-operator ]]; then
              kubectl wait --for=condition=Established --timeout=60s \
                crd/shops.shophub.io crd/wallets.shophub.io crd/discordchannels.shophub.io
            fi
          done
          helm list -A
          bad="$(helm list -A -o json | jq -r '.[] | select(.status != "deployed") | .name')"
          [ -z "$bad" ] || { echo "not deployed: $bad"; exit 1; }
          # The operator must run without CNPG/Redis or Discord credentials (research R5, R15).
          kubectl -n ci-shop-operator rollout status deploy/shop-operator --timeout=60s
          # Reconciled without Discord credentials: the reason proves the operator sees it.
          reason=""
          for _ in $(seq 30); do
            reason="$(kubectl -n ci-shop-operator get dch platform-alerts -o jsonpath='{.status.conditions[0].reason}')"
            [ -n "$reason" ] && break
            sleep 2
          done
          echo "platform-alerts: $reason"
          [ "$reason" = DiscordCredentialsMissing ] || { echo "platform-alerts was not reconciled"; exit 1; }
          # Namespaced permissions only (spec 004 FR-026, closes 002 R-1).
          if kubectl get clusterrolebinding -o json | jq -e '.items[] | select(.subjects[]? | .kind == "ServiceAccount" and .namespace == "ci-shop-operator")' >/dev/null; then
            echo "shop-operator has a ClusterRoleBinding"; exit 1
          fi
          sa=system:serviceaccount:ci-shop-operator:shop-operator
          [ "$(kubectl auth can-i list secrets -n shops --as "$sa")" = yes ]
          [ "$(kubectl auth can-i list secrets -n default --as "$sa")" = no ]
          [ "$(kubectl auth can-i list secrets -A --as "$sa")" = no ]
          [ "$(kubectl auth can-i create ingresses.networking.k8s.io -n shops --as "$sa")" = yes ]
          # ShopHub (spec 004 T023): both replicas ready against its CNPG database, and its
          # ServiceAccount may do exactly what the Role grants, in the shops namespace only.
          kubectl -n ci-shophub rollout status deploy/shophub --timeout=120s
          kubectl -n ci-shophub get networkpolicy shophub
          if kubectl get clusterrolebinding -o json | jq -e '.items[] | select(.subjects[]? | .kind == "ServiceAccount" and .namespace == "ci-shophub")' >/dev/null; then
            echo "shophub has a ClusterRoleBinding"; exit 1
          fi
          sa=system:serviceaccount:ci-shophub:shophub
          for verb in get list watch create patch delete; do
            for r in shops.shophub.io wallets.shophub.io discordchannels.shophub.io; do
              [ "$(kubectl auth can-i "$verb" "$r" -n shops --as "$sa")" = yes ] || { echo "shophub cannot $verb $r"; exit 1; }
            done
          done
          [ "$(kubectl auth can-i update shops.shophub.io -n shops --as "$sa")" = no ]
          [ "$(kubectl auth can-i get secrets -n shops --as "$sa")" = yes ]
          [ "$(kubectl auth can-i list secrets -n shops --as "$sa")" = no ]
          [ "$(kubectl auth can-i watch secrets -n shops --as "$sa")" = no ]
          [ "$(kubectl auth can-i get secrets -n ci-shophub --as "$sa")" = no ]
          [ "$(kubectl auth can-i create shops.shophub.io -n default --as "$sa")" = no ]
          [ "$(kubectl auth can-i create pods -n shops --as "$sa")" = no ]
      - name: Shop delete guard and egress policy (shop-operator 0.5.0, spec 005 D-4, R13)
        run: |
          set -euo pipefail
          kubectl -n ci-shop-operator get networkpolicy shop-operator-egress
          shop() {
            kubectl apply -f - <<EOF
          apiVersion: shophub.io/v1alpha1
          kind: Shop
          metadata: {name: $1, namespace: shops}
          spec: {shopName: Guard test, availability: standard, database: standard, walletRef: {name: w}, discordChannelRef: {name: ch}}
          EOF
          }
          # A delete without ShopHub's annotation is refused by the API server.
          shop guard-test
          if out="$(kubectl -n shops delete shop guard-test --wait=false 2>&1)"; then
            echo "an unannotated Shop delete was allowed: $out"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "Shops are deleted through ShopHub"
          # With the annotation (what ShopHub 0.3.0 writes first) it goes through.
          kubectl -n shops annotate shop guard-test shophub.io/delete-requested=true
          kubectl -n shops delete shop guard-test --timeout=60s
          # Kubernetes' own cleanup is exempt: deleting the namespace that still holds an
          # unannotated Shop finishes (namespace controller, garbage collector).
          shop guard-ns-test
          kubectl delete namespace shops --timeout=90s
          if kubectl get namespace shops 2>/dev/null; then echo "namespace shops did not go away"; exit 1; fi

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [layout, lint, template, rbac-drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Log in to GHCR with GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push unpublished chart versions (never overwrite)
        run: bash .github/scripts/publish.sh

  verify-public:
    name: verify-public
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Every chart version is pullable anonymously (SC-005)
        run: |
          set -euo pipefail
          source .github/scripts/lib.sh
          failed=0
          for d in charts/*/; do
            c="$(basename "$d")"; v="$(chart_field "$d/Chart.yaml" version)"
            if helm show chart "$OCI_BASE/$c" --version "$v" >/dev/null 2>&1; then
              echo "public: $c $v"
            else
              echo "::error::$OCI_BASE/$c:$v is not anonymously pullable — set the GHCR package to Public (quickstart.md 'Make packages public')"
              failed=1
            fi
          done
          exit $failed
